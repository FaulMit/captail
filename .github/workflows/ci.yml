name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: src/Captail/packages.lock.json

      - name: Acquire minimal OBS runtime
        shell: pwsh
        run: ./tools/AcquireObsRuntime.ps1

      - name: Build Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet restore ./src/Captail/Captail.csproj --locked-mode
          dotnet build ./Captail.sln -c Release --no-restore `
            -p:ContinuousIntegrationBuild=true

      - name: Run full .NET analyzers
        shell: pwsh
        run: |
          dotnet build ./src/Captail/Captail.csproj -c Debug --no-restore `
            -p:EnableNETAnalyzers=true `
            -p:AnalysisLevel=latest-all `
            -p:AnalysisMode=All `
            -p:WarningsAsErrors=CA1806%3BCA2000%3BCA2216%3BCA5392%3BCA5393

      - name: Validate GPU and capture capability model
        shell: pwsh
        run: |
          $exe = Resolve-Path './src/Captail/bin/Debug/net9.0-windows10.0.22621.0/win-x64/Captail.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--qa-capability-model' `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Capability model QA failed: $($process.ExitCode)"
          }

      - name: Validate replay folder routing
        shell: pwsh
        run: |
          $exe = Resolve-Path './src/Captail/bin/Debug/net9.0-windows10.0.22621.0/win-x64/Captail.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--qa-replay-routing' `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Replay routing QA failed: $($process.ExitCode)"
          }

      - name: Validate localization dictionaries
        shell: pwsh
        run: |
          $files = @(Get-ChildItem ./src/Captail/Languages/Strings.*.xaml)
          [xml]$en = Get-Content ./src/Captail/Languages/Strings.en.xaml
          $enKeys = @($en.ResourceDictionary.String | ForEach-Object { $_.Key })
          $enValues = @{}
            foreach ($entry in $en.ResourceDictionary.String) {
              $enValues[$entry.Key] = [string]$entry.'#text'
            }
            $semanticExpectations = @{
              de = @{ 'L.Storage.FreeOn' = '{0} frei auf {1}'; 'L.Storage.Free' = '{0} frei'; 'L.Video.Monitor' = 'Monitor'; 'L.Storage.ReplayFolder' = 'Replay-Ordner'; 'L.Audio.OneMixed' = 'Eine gemischte Spur' }
              en = @{ 'L.Storage.FreeOn' = '{0} free on {1}'; 'L.Storage.Free' = '{0} free'; 'L.Video.Monitor' = 'Monitor'; 'L.Storage.ReplayFolder' = 'Replay folder'; 'L.Audio.OneMixed' = 'One mixed track' }
              es = @{ 'L.Storage.FreeOn' = '{0} libres en {1}'; 'L.Storage.Free' = '{0} libres'; 'L.Video.Monitor' = 'Monitor'; 'L.Storage.ReplayFolder' = 'Carpeta de repeticiones'; 'L.Audio.OneMixed' = 'Una pista mixta' }
              fr = @{ 'L.Storage.FreeOn' = '{0} libres sur {1}'; 'L.Storage.Free' = '{0} libres'; 'L.Video.Monitor' = 'Moniteur'; 'L.Storage.ReplayFolder' = 'Dossier des replays'; 'L.Audio.OneMixed' = 'Une piste mixée' }
              ja = @{ 'L.Storage.FreeOn' = '{1} の空き容量: {0}'; 'L.Storage.Free' = '空き容量: {0}'; 'L.Video.Monitor' = 'モニター'; 'L.Storage.ReplayFolder' = 'リプレイフォルダー'; 'L.Audio.OneMixed' = 'ミックストラック 1 つ' }
              ko = @{ 'L.Storage.FreeOn' = '{1} 여유 공간 {0}'; 'L.Storage.Free' = '여유 공간 {0}'; 'L.Video.Monitor' = '모니터'; 'L.Storage.ReplayFolder' = '리플레이 폴더'; 'L.Audio.OneMixed' = '혼합 트랙 1개' }
              pl = @{ 'L.Storage.FreeOn' = '{0} wolnego miejsca na {1}'; 'L.Storage.Free' = '{0} wolnego miejsca'; 'L.Video.Monitor' = 'Monitor'; 'L.Storage.ReplayFolder' = 'Folder powtórek'; 'L.Audio.OneMixed' = 'Jedna ścieżka mieszana' }
              pt = @{ 'L.Storage.FreeOn' = '{0} livres em {1}'; 'L.Storage.Free' = '{0} livres'; 'L.Video.Monitor' = 'Monitor'; 'L.Storage.ReplayFolder' = 'Pasta de replays'; 'L.Audio.OneMixed' = 'Uma faixa mista' }
              ru = @{ 'L.Storage.FreeOn' = '{0} свободно на {1}'; 'L.Storage.Free' = '{0} свободно'; 'L.Video.Monitor' = 'Монитор'; 'L.Storage.ReplayFolder' = 'Папка повторов'; 'L.Audio.OneMixed' = 'Одна общая' }
              uk = @{ 'L.Storage.FreeOn' = '{0} вільно на {1}'; 'L.Storage.Free' = '{0} вільно'; 'L.Video.Monitor' = 'Монітор'; 'L.Storage.ReplayFolder' = 'Папка повторів'; 'L.Audio.OneMixed' = 'Одна змішана доріжка' }
              zh = @{ 'L.Storage.FreeOn' = '{1} 剩余 {0}'; 'L.Storage.Free' = '剩余 {0}'; 'L.Video.Monitor' = '显示器'; 'L.Storage.ReplayFolder' = '回放文件夹'; 'L.Audio.OneMixed' = '单条混音音轨' }
            }
          if ($enKeys.Count -ne ($enKeys | Sort-Object -Unique).Count) {
            throw "English localization contains duplicate keys."
          }
            foreach ($file in $files) {
              [xml]$dictionary = Get-Content $file.FullName
              $keys = @($dictionary.ResourceDictionary.String | ForEach-Object { $_.Key })
              $values = @{}
            $differences = @(Compare-Object $enKeys $keys)
            if ($differences.Count -ne 0) {
              $differences | Format-Table | Out-String | Write-Error
              throw "Localization keys differ in $($file.Name)."
            }
            if ($keys.Count -ne ($keys | Sort-Object -Unique).Count) {
              throw "$($file.Name) contains duplicate keys."
            }
              foreach ($entry in $dictionary.ResourceDictionary.String) {
                $value = [string]$entry.'#text'
                $values[$entry.Key] = $value
              if ([string]::IsNullOrWhiteSpace($value)) {
                throw "$($file.Name) contains an empty value for $($entry.Key)."
              }
              $expectedPlaceholders = @(
                [regex]::Matches($enValues[$entry.Key], '\{\d+\}') |
                  ForEach-Object Value |
                  Sort-Object)
              $actualPlaceholders = @(
                [regex]::Matches($value, '\{\d+\}') |
                  ForEach-Object Value |
                  Sort-Object)
              if (@(Compare-Object $expectedPlaceholders $actualPlaceholders).Count -ne 0) {
                throw "$($file.Name) changed placeholders for $($entry.Key)."
              }
              if ($entry.Key -eq 'L.Brand' -and $value -ne 'Captail') {
                throw "$($file.Name) changed the Captail brand."
                }
              }
              $language = $file.BaseName.Split('.')[-1]
              if (-not $semanticExpectations.ContainsKey($language)) {
                throw "No semantic localization expectations for $($file.Name)."
              }
              foreach ($expectation in $semanticExpectations[$language].GetEnumerator()) {
                if ($values[$expectation.Key] -cne $expectation.Value) {
                  throw "$($file.Name) has an unsafe translation for $($expectation.Key): '$($values[$expectation.Key])'."
                }
              }
            }
          Write-Host "$($files.Count) localization dictionaries match: $($enKeys.Count) keys."

      - name: Test localized dashboard layout
        shell: pwsh
        run: ./tools/TestLocalizedLayout.ps1

      - name: Validate Microsoft Store listing
        shell: pwsh
        run: |
          $listing = Get-Content ./store-listing/listing.json -Raw | ConvertFrom-Json
          ./tools/SyncStoreListing.ps1 `
            -Version ([string]$listing.ReleaseVersion) `
            -ValidateOnly

      - name: Test Microsoft Store release workflow
        shell: pwsh
        run: ./tools/TestStoreReleaseWorkflow.ps1

      - name: Test sanitized diagnostic log export
        shell: pwsh
        run: ./tools/TestDiagnosticLogExporter.ps1

      - name: Test localization policy
        shell: pwsh
        run: |
          $exe = Resolve-Path './src/Captail/bin/Debug/net9.0-windows10.0.22621.0/win-x64/Captail.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--qa-localization' `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Localization policy QA failed: $($process.ExitCode)"
          }

      - name: Build pull request Portable package
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          [xml]$project = Get-Content ./src/Captail/Captail.csproj
          $version = [string]($project.Project.PropertyGroup.Version |
            Select-Object -First 1)
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid Captail project version: $version"
          }
          ./tools/BuildRelease.ps1 `
            -Version $version `
            -OutputDirectory artifacts/pr-preview `
            -SkipInstaller

      - name: Upload pull request Portable package
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Captail-PR-${{ github.event.pull_request.number }}-win-x64
          path: |
            artifacts/pr-preview/Captail-*-Portable-win-x64.zip
            artifacts/pr-preview/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
